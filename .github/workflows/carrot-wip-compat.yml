name: Current carrot-wip software compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [feature/jetlink-multimodel-carrot]
    paths:
      - 'adapters/**'
      - 'jetlink/**'
      - 'tools/check_latest_carrot_compat.py'
      - 'tools/build_trt_v3.py'
      - 'tools/patch_v3_uint8.py'
      - 'tests/**'
      - 'artifacts/*.json'
      - '.github/workflows/carrot-wip-compat.yml'

# GitHub only schedules workflows present on the repository default branch.
# Until this file is there, use workflow_dispatch; neither event changes main.
permissions:
  contents: read

concurrency:
  group: carrot-wip-compat
  cancel-in-progress: false

jobs:
  software-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jetlink-multimodel-carrot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install 'pytest>=8,<9' 'numpy>=2,<3' 'onnx>=1.17,<2'
      - name: Test rolling verification gates
        run: python -m pytest -q tests/test_latest_carrot_compat.py
      - name: Fetch latest heads and verify disposable source candidate
        run: python tools/check_latest_carrot_compat.py --report .reports/carrot-compat.json
      - name: Preserve evidence, review patch, manifest and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrot-wip-software-compat-${{ github.run_id }}
          path: .reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
